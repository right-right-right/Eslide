<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup-container">
        <header class="popup-header">
            <span class="popup-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                </svg></span>
            <h1 class="popup-title" data-i18n="popup.title">Eslide</h1>
        </header>

        <div class="popup-body">
            <button id="toggleBtn" class="toggle-btn toggle-btn-off">
                <span class="toggle-btn-icon"></span>
                <span class="toggle-btn-text" data-i18n="popup.toggle.enter">进入编辑模式</span>
            </button>

            <div class="action-buttons">
                <button id="exportBtn" class="secondary-btn" disabled data-i18n-attr="title:popup.export.title">
                    <svg class="popup-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    <span data-i18n="popup.export">导出 HTML</span>
                </button>
            </div>

            <div id="statusBar" class="status-bar status-off">
                <span class="status-dot"></span>
                <span class="status-text" data-i18n="popup.status.off">未激活 — 点击上方按钮开始</span>
            </div>

            <div id="editStats" class="edit-stats" style="display:none">
                <div class="edit-stat-item">
                    <span class="edit-stat-value" id="editCountValue">0</span>
                    <span class="edit-stat-label" data-i18n="popup.stats.edits">修改数</span>
                </div>
                <div class="edit-stat-item">
                    <span class="edit-stat-value" id="editableCountValue">0</span>
                    <span class="edit-stat-label" data-i18n="popup.stats.editable">可编辑</span>
                </div>
            </div>

            <div class="tips-section">
                <h3 class="tips-title">
                    <svg class="popup-tips-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                    </svg>
                    <span data-i18n="popup.tips.title">操作提示</span>
                </h3>
                <ul class="tips-list">
                    <li data-i18n-html="popup.tips.click"><kbd>点击</kbd> 幻灯片中的文字即可编辑</li>
                    <li data-i18n-html="popup.tips.undo"><kbd>Ctrl+Z</kbd> 撤销 · <kbd>Ctrl+Y</kbd> 重做</li>
                    <li data-i18n-html="popup.tips.esc"><kbd>Esc</kbd> 取消当前编辑 / 退出编辑模式</li>
                    <li data-i18n-html="popup.tips.tab"><kbd>Tab</kbd> 跳转到下一个可编辑文字</li>
                    <li data-i18n-html="popup.tips.export"><kbd>Ctrl+S</kbd> 导出 HTML 文件</li>
                </ul>
            </div>
        </div>

        <footer class="popup-footer">
            <span class="version" id="versionText"></span>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
